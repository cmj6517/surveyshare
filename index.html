<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parts of Plants 단어 게임</title>
<style>
  :root {
    --green: #2E7D4F;
    --green-dark: #1F5C39;
    --green-light: #E8F5EC;
    --leaf: #8BC34A;
    --sun: #FFC107;
    --sky: #EAF7F0;
    --brown: #8D6E63;
    --red: #E24C4B;
    --text: #22321F;
    --sub: #6b7d68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
    background: linear-gradient(180deg, #EAF7F0 0%, #F7FBF4 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 14px 60px 14px;
  }
  .app { width: 100%; max-width: 480px; }

  .brandbar {
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px; justify-content: center;
  }
  .brandbar span {
    font-size: 13px; font-weight: 800; color: var(--green-dark);
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ---------- Start screen ---------- */
  .hero {
    background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
    border-radius: 22px;
    padding: 30px 24px;
    color: #fff;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .hero .big-emoji { font-size: 46px; margin-bottom: 6px; }
  .hero h1 {
    font-size: 23px; line-height: 1.4; margin: 0 0 6px 0; font-weight: 900;
  }
  .hero p {
    font-size: 13.5px; color: #DFF3E6; margin: 0; line-height: 1.6;
  }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .mode-card {
    background: #fff; border: 2px solid #DCEEDF; border-radius: 16px;
    padding: 16px 14px; cursor: pointer; text-align: left;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .mode-card:hover { border-color: var(--green); transform: translateY(-2px); }
  .mode-card.full { grid-column: 1 / -1; background: var(--green); border-color: var(--green); }
  .mode-card.full .mode-title, .mode-card.full .mode-sub { color: #fff; }
  .mode-card.full .mode-sub { color: #DFF3E6; }
  .mode-emoji { font-size: 22px; margin-bottom: 6px; }
  .mode-title { font-size: 15px; font-weight: 800; color: var(--green-dark); margin-bottom: 3px; }
  .mode-sub { font-size: 11.5px; color: var(--sub); }

  /* ---------- Game screen ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .subject-badge {
    font-size: 12px; font-weight: 800; color: var(--green-dark);
    background: var(--green-light); padding: 5px 12px; border-radius: 20px;
  }
  .stat-group { display: flex; gap: 10px; align-items: center; }
  .streak { font-size: 13px; font-weight: 800; color: var(--sun); }
  .score { font-size: 13px; font-weight: 800; color: var(--green-dark); }

  .progress-track { width: 100%; height: 10px; background: #DCEEDF; border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--leaf), var(--green)); width: 0%; transition: width 0.35s ease; border-radius: 6px; }

  .qcounter { font-size: 12.5px; color: var(--sub); font-weight: 800; margin-bottom: 8px; text-align: center; }

  .qcard {
    background: #fff; border-radius: 20px; padding: 26px 20px;
    box-shadow: 0 6px 18px rgba(46,125,79,0.12);
    margin-bottom: 16px; min-height: 100px; text-align: center;
  }
  .qtag {
    display: inline-block; font-size: 11px; font-weight: 800; color: var(--green);
    background: var(--green-light); padding: 3px 10px; border-radius: 12px; margin-bottom: 10px;
  }
  .qtext { font-size: 17px; font-weight: 800; line-height: 1.5; color: var(--text); }
  .qtext .accent { color: var(--green-dark); }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 2px solid #DCEEDF; border-radius: 14px;
    padding: 14px 16px; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease, transform 0.08s ease;
    text-align: left;
  }
  .opt:hover:not(.disabled) { border-color: var(--green); transform: translateX(2px); }
  .opt .letter {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    background: var(--green-light); color: var(--green-dark);
    font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .opt.correct { background: #EAF6EE; border-color: var(--green); }
  .opt.correct .letter { background: var(--green); color: #fff; }
  .opt.wrong { background: #FBEAE8; border-color: var(--red); }
  .opt.wrong .letter { background: var(--red); color: #fff; }
  .opt.disabled { cursor: default; }

  .feedback { display: none; margin-top: 14px; padding: 14px 16px; border-radius: 14px; font-size: 13.5px; line-height: 1.6; }
  .feedback.show { display: block; }
  .feedback.correct { background: #EAF6EE; color: #1F5C39; border: 2px solid #BEE3C8; }
  .feedback.wrong { background: #FBEAE8; color: #8a2e24; border: 2px solid #f3d0cc; }
  .feedback b { display: block; margin-bottom: 4px; font-size: 14px; }

  .next-btn {
    margin-top: 16px; width: 100%; padding: 15px; border: none; border-radius: 14px;
    background: var(--green); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; display: none;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { background: var(--green-dark); }

  /* ---------- Result screen ---------- */
  .result-hero {
    text-align: center; background: linear-gradient(135deg, var(--green), var(--green-dark));
    border-radius: 22px; padding: 34px 20px; color: #fff; margin-bottom: 18px;
  }
  .result-emoji { font-size: 50px; }
  .result-grade { font-size: 44px; font-weight: 900; color: var(--sun); margin: 4px 0; }
  .result-score { font-size: 15px; color: #DFF3E6; }
  .result-msg { font-size: 13.5px; color: #EFFbF2; margin-top: 10px; }

  .review-item { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; border-left: 5px solid #DCEEDF; }
  .review-item.correct { border-left-color: var(--green); }
  .review-item.wrong { border-left-color: var(--red); }
  .review-item .rtag { font-size: 11px; font-weight: 800; color: var(--sub); margin-bottom: 4px; }
  .review-item .rq { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
  .review-item .ra { font-size: 12.5px; color: var(--sub); }

  .retry-btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    background: var(--sun); color: #4a3300; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 16px;
  }
  .home-btn {
    width: 100%; padding: 13px; border: 2px solid #DCEEDF; border-radius: 14px;
    background: #fff; color: var(--green-dark); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;
  }
</style>
</head>
<body>
<div class="app">

  <div class="brandbar"><span>🌱 Subject Link 1 · Lesson 1. Parts of Plants 🌱</span></div>

  <!-- START SCREEN -->
  <div class="screen active" id="startScreen">
    <div class="hero">
      <div class="big-emoji">🌻</div>
      <h1>식물 단어 퀴즈 게임</h1>
      <p>12개 단어를 게임으로 재미있게 외워봐요! 정답을 맞힐 때마다 콤보가 쌓여요 🔥</p>
    </div>

    <div class="mode-grid">
      <div class="mode-card full" onclick="startGame('all')">
        <div class="mode-emoji">🏆</div>
        <div class="mode-title">전체 도전 (24문제)</div>
        <div class="mode-sub">영어 뜻 맞추기 + 한글 뜻 맞추기 모두!</div>
      </div>
      <div class="mode-card" onclick="startGame('eng')">
        <div class="mode-emoji">🇬🇧</div>
        <div class="mode-title">영어 뜻 맞추기</div>
        <div class="mode-sub">12문제</div>
      </div>
      <div class="mode-card" onclick="startGame('kor')">
        <div class="mode-emoji">🇰🇷</div>
        <div class="mode-title">한글 뜻 맞추기</div>
        <div class="mode-sub">12문제</div>
      </div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="gameScreen">
    <div class="topbar">
      <span class="subject-badge" id="subjectBadge">모드</span>
      <div class="stat-group">
        <span class="streak" id="streakDisplay">🔥 0</span>
        <span class="score" id="scoreDisplay">⭐ 0</span>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="qcounter" id="qCounter">문제 1 / 24</div>

    <div class="qcard">
      <div class="qtag" id="qTag">영어 뜻</div>
      <div class="qtext" id="qText">문제 텍스트</div>
    </div>

    <div class="options" id="optionsBox"></div>

    <div class="feedback" id="feedbackBox">
      <b id="feedbackTitle"></b>
      <span id="feedbackText"></span>
    </div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 문제 🌿</button>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen" id="resultScreen">
    <div class="result-hero">
      <div class="result-emoji" id="resultEmoji">🌟</div>
      <div style="font-size:13px;color:#DFF3E6;">게임 완료!</div>
      <div class="result-grade" id="resultGrade">A</div>
      <div class="result-score" id="resultScoreText">24문제 중 0문제 정답</div>
      <div class="result-msg" id="resultMsg"></div>
    </div>

    <div id="reviewList"></div>

    <button class="retry-btn" onclick="location.reload()">다시 도전하기 🔄</button>
    <button class="home-btn" onclick="location.reload()">처음 화면으로</button>
  </div>

</div>

<script>
const WORDS = [
  { word: "flower", pos: "noun", def: "a colorful part of a plant", kor: "꽃" },
  { word: "root", pos: "noun", def: "a part of a plant that gets water and food from the soil", kor: "뿌리" },
  { word: "stem", pos: "noun", def: "a long plant part that leaves and flowers grow on", kor: "줄기" },
  { word: "leaf", pos: "noun", def: "a green part of a plant that grows from a stem", kor: "잎" },
  { word: "seed", pos: "noun", def: "a small object that can grow a new plant", kor: "씨앗" },
  { word: "soil", pos: "noun", def: "dirt that plants grow in", kor: "토양" },
  { word: "plant", pos: "noun", def: "a thing that grows in the ground and often has roots, stems, leaves, and flowers", kor: "식물" },
  { word: "in common", pos: "", def: "to have similar interests or characteristics", kor: "공통점이 많은" },
  { word: "eventually", pos: "adverb", def: "finally", kor: "결국" },
  { word: "nutrient", pos: "noun", def: "a substance in food that helps living things survive and grow", kor: "영양소" },
  { word: "allow", pos: "verb", def: "to make it possible for someone to do something or something to happen", kor: "~을 하도록 허락하다" },
  { word: "sunlight", pos: "noun", def: "light from the sun", kor: "햇빛" },
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDistractors(correctWord, n) {
  const pool = WORDS.filter(w => w.word !== correctWord).map(w => w.word);
  return shuffle(pool).slice(0, n);
}

function makeEngQuestions() {
  return WORDS.map(w => {
    const distractors = buildDistractors(w.word, 3);
    const options = shuffle([w.word, ...distractors]);
    return {
      type: "영어 뜻",
      q: `다음 영어 설명에 맞는 단어는?\n"${w.def}"`,
      options,
      answer: options.indexOf(w.word),
      explain: `${w.word} (${w.pos || "표현"}) — ${w.kor} : ${w.def}`
    };
  });
}

function makeKorQuestions() {
  return WORDS.map(w => {
    const distractors = buildDistractors(w.word, 3);
    const options = shuffle([w.word, ...distractors]);
    return {
      type: "한글 뜻",
      q: `'${w.kor}' 의 뜻을 가진 영어 단어는?`,
      options,
      answer: options.indexOf(w.word),
      explain: `${w.word} (${w.pos || "표현"}) — ${w.kor} : ${w.def}`
    };
  });
}

let currentSet = [];
let currentIndex = 0;
let score = 0;
let streak = 0;
let maxStreak = 0;
let results = [];
let answered = false;

function startGame(mode) {
  if (mode === 'all') {
    currentSet = shuffle([...makeEngQuestions(), ...makeKorQuestions()]);
  } else if (mode === 'eng') {
    currentSet = shuffle(makeEngQuestions());
  } else {
    currentSet = shuffle(makeKorQuestions());
  }
  currentIndex = 0;
  score = 0;
  streak = 0;
  maxStreak = 0;
  results = [];

  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = currentSet[currentIndex];
  document.getElementById('subjectBadge').textContent = q.type;
  document.getElementById('qTag').textContent = q.type;
  document.getElementById('qCounter').textContent = `문제 ${currentIndex + 1} / ${currentSet.length}`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('scoreDisplay').textContent = `⭐ ${score}`;
  document.getElementById('streakDisplay').textContent = `🔥 ${streak}`;
  document.getElementById('progressFill').style.width = `${(currentIndex / currentSet.length) * 100}%`;

  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="letter">${letters[idx]}</span><span>${opt}</span>`;
    div.onclick = () => selectOption(idx, div);
    box.appendChild(div);
  });

  document.getElementById('feedbackBox').classList.remove('show', 'correct', 'wrong');
  document.getElementById('nextBtn').classList.remove('show');
}

function selectOption(idx, el) {
  if (answered) return;
  answered = true;
  const q = currentSet[currentIndex];
  const isCorrect = idx === q.answer;
  const opts = document.querySelectorAll('.opt');

  opts.forEach((o, i) => {
    o.classList.add('disabled');
    if (i === q.answer) o.classList.add('correct');
    if (i === idx && !isCorrect) o.classList.add('wrong');
  });

  const fb = document.getElementById('feedbackBox');
  const fbTitle = document.getElementById('feedbackTitle');
  const fbText = document.getElementById('feedbackText');

  if (isCorrect) {
    score += 10 + streak * 2;
    streak += 1;
    maxStreak = Math.max(maxStreak, streak);
    fb.classList.add('show', 'correct');
    fbTitle.textContent = streak > 1 ? `정답이에요! 🔥 ${streak}콤보` : '정답이에요! 🎉';
  } else {
    streak = 0;
    fb.classList.add('show', 'wrong');
    fbTitle.textContent = '아쉬워요, 다시 한번 확인해볼까요?';
  }
  fbText.textContent = q.explain;

  results.push({ q: q.q.replace(/\n/g, ' '), type: q.type, correct: isCorrect, explain: q.explain, correctAnswer: q.options[q.answer] });

  document.getElementById('scoreDisplay').textContent = `⭐ ${score}`;
  document.getElementById('streakDisplay').textContent = `🔥 ${streak}`;
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('nextBtn').textContent = currentIndex === currentSet.length - 1 ? '결과 보기 🏁' : '다음 문제 🌿';
}

function nextQuestion() {
  currentIndex += 1;
  if (currentIndex >= currentSet.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('resultScreen').classList.add('active');

  const correctCount = results.filter(r => r.correct).length;
  const total = results.length;
  const pct = correctCount / total;

  let grade = 'D', emoji = '🌱', msg = '단어를 다시 한번 천천히 살펴볼까요?';
  if (pct >= 0.9) { grade = 'S'; emoji = '🌳'; msg = '완벽해요! 식물 단어 박사님이네요!'; }
  else if (pct >= 0.75) { grade = 'A'; emoji = '🌻'; msg = '아주 잘했어요! 틀린 문제만 한 번 더 봐요.'; }
  else if (pct >= 0.5) { grade = 'B'; emoji = '🌿'; msg = '잘하고 있어요! 조금만 더 연습해봐요.'; }
  else { grade = 'C'; emoji = '🌱'; msg = '처음엔 어려울 수 있어요. 다시 도전해봐요!'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultGrade').textContent = grade;
  document.getElementById('resultScoreText').textContent = `${total}문제 중 ${correctCount}문제 정답 · 점수 ${score}점 · 최고 콤보 ${maxStreak}`;
  document.getElementById('resultMsg').textContent = msg;

  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  results.forEach((r) => {
    const div = document.createElement('div');
    div.className = `review-item ${r.correct ? 'correct' : 'wrong'}`;
    div.innerHTML = `
      <div class="rtag">${r.type} · ${r.correct ? '정답' : '오답'}</div>
      <div class="rq">${r.q}</div>
      <div class="ra">${r.correct ? '' : '정답: ' + r.correctAnswer + ' — '}${r.explain}</div>
    `;
    list.appendChild(div);
  });
}
</script>
</body>
</html>
