<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 퀴즈 게임</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f5f4f0;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 420px; }
  h1 {
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 20px;
    color: #222;
  }
  .upload-box {
    background: #fff;
    border: 1.5px dashed #ccc;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .upload-box img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 8px;
    margin-top: 12px;
    display: none;
  }
  .upload-box input[type=file] {
    display: none;
  }
  .upload-label {
    display: inline-block;
    padding: 10px 18px;
    background: #333;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .filename {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
  }
  #testBtn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: #2f6fed;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 24px;
  }
  #testBtn:active { transform: scale(0.98); }
  #testBtn:disabled { background: #aac2f2; cursor: not-allowed; }

  #game { display: none; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
    color: #666;
  }
  .score { font-weight: 600; color: #222; }

  .card {
    background: #fff;
    border: 1px solid #e5e3dd;
    border-radius: 12px;
    padding: 24px 18px;
    text-align: center;
    margin-bottom: 16px;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .pos { font-size: 12px; color: #999; margin-bottom: 6px; }
  .def { font-size: 16px; line-height: 1.6; color: #222; }

  .label { font-size: 12px; color: #999; margin-bottom: 6px; }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .box {
    min-height: 52px;
    padding: 8px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }
  .box.word { font-weight: 600; font-size: 17px; }
  .box.correct { border-color: #2fa84f; background: #eaf8ee; color: #1e7a37; }
  .box.wrong { border-color: #e0453f; background: #fdecec; color: #a5312c; }

  .feedback {
    text-align: center;
    font-size: 14px;
    min-height: 20px;
    margin-top: 4px;
  }
  .feedback.correct { color: #1e7a37; }
  .feedback.wrong { color: #a5312c; }

  .final {
    text-align: center;
    padding: 40px 0;
    display: none;
  }
  .final h2 { font-size: 20px; margin-bottom: 8px; }
  .final p { color: #666; margin-bottom: 20px; }
  #restartBtn {
    padding: 12px 24px;
    font-size: 15px;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>단어 퀴즈 게임</h1>

  <div class="upload-box" id="uploadBox">
    <label class="upload-label" for="fileInput">사진 올리기</label>
    <input type="file" id="fileInput" accept="image/*">
    <div class="filename" id="filename">단어장 사진을 올려주세요</div>
    <img id="preview">
  </div>

  <button id="testBtn">테스트 시작</button>

  <div id="game">
    <div class="topbar">
      <span id="progress">1 / 10</span>
      <span class="score" id="score">★ 0</span>
    </div>

    <div class="card">
      <div class="pos" id="pos"></div>
      <div class="def" id="def"></div>
    </div>

    <div class="label">단어</div>
    <div class="row">
      <button class="box word" id="w1"></button>
      <button class="box word" id="w2"></button>
    </div>

    <div class="label">한국어 뜻</div>
    <div class="row">
      <button class="box" id="k1"></button>
      <button class="box" id="k2"></button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="final" id="final">
    <h2>완료!</h2>
    <p id="finalScore"></p>
    <button id="restartBtn">다시하기</button>
  </div>
</div>

<script>
const words = [
  {w:"proof", pos:"n.", def:"information, documents, etc. that show that something is true", kr:"증거, 증명"},
  {w:"space", pos:"n.", def:"an area or a place that is empty", kr:"공간"},
  {w:"important", pos:"adj.", def:"having a great effect on people or things; of great value", kr:"중요한"},
  {w:"happen", pos:"v.", def:"to take place, especially without being planned", kr:"(일이) 일어나다"},
  {w:"knock", pos:"v.", def:"to hit something so that it moves or breaks", kr:"치다"},
  {w:"bowl", pos:"n.", def:"a deep round dish with a wide open top, used especially for holding food or liquid", kr:"그릇"},
  {w:"learn", pos:"v.", def:"to gain knowledge or skill by studying, from experience, from being taught, etc.", kr:"배우다"},
  {w:"pooped", pos:"adj.", def:"very tired", kr:"녹초가 된"},
  {w:"crunch", pos:"v.", def:"to bite something noisily between your teeth when you are eating", kr:"아작아작 씹다"},
  {w:"note", pos:"n.", def:"a short piece of writing", kr:"메모"}
];

const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const filename = document.getElementById('filename');
const testBtn = document.getElementById('testBtn');
const uploadBox = document.getElementById('uploadBox');
const gameEl = document.getElementById('game');
const finalEl = document.getElementById('final');

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  filename.textContent = file.name;
  const reader = new FileReader();
  reader.onload = (ev) => {
    preview.src = ev.target.result;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

testBtn.addEventListener('click', () => {
  uploadBox.style.display = 'none';
  testBtn.style.display = 'none';
  gameEl.style.display = 'block';
  startGame();
});

let order, idx, score, locked;
const defEl = document.getElementById('def');
const posEl = document.getElementById('pos');
const w1 = document.getElementById('w1');
const w2 = document.getElementById('w2');
const k1 = document.getElementById('k1');
const k2 = document.getElementById('k2');
const feedbackEl = document.getElementById('feedback');
const progressEl = document.getElementById('progress');
const scoreEl = document.getElementById('score');
const finalScoreEl = document.getElementById('finalScore');

function pickWrong(correctIdx) {
  const pool = words.filter((x, i) => i !== correctIdx);
  return pool[Math.floor(Math.random() * pool.length)];
}

function resetBox(btn) {
  btn.classList.remove('correct', 'wrong');
}

function loadQuestion() {
  locked = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  [w1, w2, k1, k2].forEach(resetBox);

  const correctIdx = order[idx];
  const item = words[correctIdx];
  const wrong = pickWrong(correctIdx);

  defEl.textContent = item.def;
  posEl.textContent = item.pos;

  const wordOnLeft = Math.random() < 0.5;
  w1.textContent = wordOnLeft ? item.w : wrong.w;
  w2.textContent = wordOnLeft ? wrong.w : item.w;
  w1.dataset.correct = wordOnLeft ? "1" : "0";
  w2.dataset.correct = wordOnLeft ? "0" : "1";

  const krOnLeft = Math.random() < 0.5;
  k1.textContent = krOnLeft ? item.kr : wrong.kr;
  k2.textContent = krOnLeft ? wrong.kr : item.kr;
  k1.dataset.correct = krOnLeft ? "1" : "0";
  k2.dataset.correct = krOnLeft ? "0" : "1";

  progressEl.textContent = (idx + 1) + ' / ' + words.length;
}

function markCorrectAll() {
  [w1, w2, k1, k2].forEach(b => {
    if (b.dataset.correct === "1") b.classList.add('correct');
  });
}

function choose(btn) {
  if (locked) return;
  locked = true;
  const isCorrect = btn.dataset.correct === "1";
  if (isCorrect) {
    btn.classList.add('correct');
    feedbackEl.textContent = '정답!';
    feedbackEl.className = 'feedback correct';
    score++;
    scoreEl.textContent = '★ ' + score;
  } else {
    btn.classList.add('wrong');
    markCorrectAll();
    feedbackEl.textContent = '오답';
    feedbackEl.className = 'feedback wrong';
  }
  setTimeout(() => {
    idx++;
    if (idx >= words.length) {
      gameEl.style.display = 'none';
      finalEl.style.display = 'block';
      finalScoreEl.textContent = score + ' / ' + words.length + ' 맞춤';
    } else {
      loadQuestion();
    }
  }, 800);
}

[w1, w2, k1, k2].forEach(b => b.addEventListener('click', () => choose(b)));

document.getElementById('restartBtn').addEventListener('click', () => {
  finalEl.style.display = 'none';
  gameEl.style.display = 'block';
  startGame();
});

function startGame() {
  order = [...Array(words.length).keys()].sort(() => Math.random() - 0.5);
  idx = 0;
  score = 0;
  scoreEl.textContent = '★ 0';
  loadQuestion();
}
</script>
</body>
</html>
